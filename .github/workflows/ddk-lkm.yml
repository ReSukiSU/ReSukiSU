name: Build KernelSU Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      arch:
        description: "target's architecture (arm64/x86_64)"
        required: true
        type: string
        default: 'arm64'
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260828'
        type: string
      expected_pr_build_size:
        description: 'Second expected signature size (for PR builds)'
        required: false
        default: ''
        type: string
      expected_pr_build_hash:
        description: 'Second expected signature hash (for PR builds)'
        required: false
        default: ''
        type: string


jobs:
  build-kernelsu-ko:
    name: Build kernelsu.ko for ${{ inputs.kmi }} ${{ inputs.arch }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v7

    - name: Add Safe Directory
      run: |
        git config --global --add safe.directory /__w/ReSukiSU/ReSukiSU

    - name: Build kernelsu.ko
      if: ${{ inputs.arch == 'arm64' }}
      env:
        EXPECTED_PR_BUILD_SIZE: ${{ inputs.expected_pr_build_size }}
        EXPECTED_PR_BUILD_HASH: ${{ inputs.expected_pr_build_hash }}
      run: |
        cd kernel

        echo "=== Building kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$EXPECTED_PR_BUILD_SIZE" ] && [ -z "$EXPECTED_PR_BUILD_HASH" ]; then
          echo "ERROR: expected_pr_build_hash must be provided when expected_pr_build_size is set."
          exit 1
        fi
        if [ -z "$EXPECTED_PR_BUILD_SIZE" ] && [ -n "$EXPECTED_PR_BUILD_HASH" ]; then
          echo "ERROR: expected_pr_build_size must be provided when expected_pr_build_hash is set."
          exit 1
        fi
        if [ -n "$EXPECTED_PR_BUILD_SIZE" ]; then
          EXTRA_ARGS="KSU_EXPECTED_PR_BUILD_SIZE=$EXPECTED_PR_BUILD_SIZE KSU_EXPECTED_PR_BUILD_HASH=$EXPECTED_PR_BUILD_HASH"
        fi

        CONFIG_KSU=m CONFIG_KSU_MULTI_MANAGER_SUPPORT=y CONFIG_KSU_TRACEPOINT_HOOK=y CC=clang make $EXTRA_ARGS
        
        echo "=== Build completed ==="
        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/aarch64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"

    - name: Upload kernelsu.ko artifact
      if: ${{ inputs.arch == 'arm64' }}
      uses: actions/upload-artifact@v7
      with:
        name: aarch64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/aarch64/${{ inputs.kmi }}_kernelsu.ko

    - name: Build kernelsu.ko for x64
      if: ${{ inputs.arch == 'x86_64' }}
      env:
        EXPECTED_PR_BUILD_SIZE: ${{ inputs.expected_pr_build_size }}
        EXPECTED_PR_BUILD_HASH: ${{ inputs.expected_pr_build_hash }}
      run: |
        cd kernel

        echo "=== Preparing KDIR for x64 ==="

        mkdir -p /opt/ddk/kdir-x64
        unset ARCH
        unset CROSS_COMPILE
        export ARCH=x86_64
        kmi=${{ inputs.kmi }}
        pushd /opt/ddk/src/$kmi
        export KDIR=/opt/ddk/kdir-x64/$kmi

        # ddk-min images contain the source tarball, whose modpost patch is
        # not applied to the fresh x86 kdir.  Keep the patch idempotent so
        # this also works when the image already contains one or more fixes.
        MODPOST=scripts/mod/modpost.c
        sed -i -E 's/^([[:space:]]*)check_exports\(mod\);/\1\/\/ check_exports(mod);/' "$MODPOST"
        sed -i -E 's/^([[:space:]]*)s->module = exp->module;/\1\/\/ s->module = exp->module;/' "$MODPOST"
        sed -i 's/^static void check_exports(/static void __attribute__((unused)) check_exports(/' "$MODPOST"
        sed -i 's/__version_ext_names\\") =\\n/__version_ext_names\\") = \\"\\"\\n/' "$MODPOST"

        make O=$KDIR gki_defconfig
        scripts/config --file $KDIR/.config -d LTO_CLANG -e LTO_NONE -d LTO_CLANG_THIN -d LTO_CLANG_FULL -d THINLTO
        if [ "$kmi" == "android16-6.12" ] || [ "$kmi" == "android17-6.18" ]; then
            scripts/config --file $KDIR/.config -e CONFIG_CFI_ICALL_NORMALIZE_INTEGERS
        fi
        make O=$KDIR modules_prepare
        # Generate SELinux headers through Kbuild in this x86 output tree.
        make O=$KDIR security/selinux/built-in.a
        popd
        
        echo "=== Building x64 kernelsu.ko for KMI: ${{ inputs.kmi }} ==="

        EXTRA_ARGS=""
        if [ -n "$EXPECTED_PR_BUILD_SIZE" ] && [ -z "$EXPECTED_PR_BUILD_HASH" ]; then
          echo "ERROR: pr_build_hash must be provided when pr_build_size is set."
          exit 1
        fi
        if [ -z "$EXPECTED_PR_BUILD_SIZE" ] && [ -n "$EXPECTED_PR_BUILD_HASH" ]; then
          echo "ERROR: pr_build_size must be provided when pr_build_hash is set."
          exit 1
        fi
        if [ -n "$EXPECTED_PR_BUILD_SIZE" ]; then
          EXTRA_ARGS="KSU_EXPECTED_PR_BUILD_SIZE=$EXPECTED_PR_BUILD_SIZE KSU_EXPECTED_PR_BUILD_HASH=$EXPECTED_PR_BUILD_HASH"
        fi
        
        MDIR=$(realpath .)

        if [ "$kmi" == "android17-6.18" ]; then
          make -C $KDIR M=$MDIR MO=$MDIR compile_commands.json modules CONFIG_KSU=m CONFIG_KSU_MULTI_MANAGER_SUPPORT=y CONFIG_KSU_TRACEPOINT_HOOK=y CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y $EXTRA_ARGS
        else
          make -C $KDIR M=$MDIR src=$MDIR compile_commands.json modules CONFIG_KSU=m CONFIG_KSU_MULTI_MANAGER_SUPPORT=y CONFIG_KSU_TRACEPOINT_HOOK=y CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y $EXTRA_ARGS
        fi

        echo "=== Build completed ==="

        # Create output directory in GitHub workspace
        OUT_DIR=/github/workspace/out/x86_64
        mkdir -p $OUT_DIR

        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_kernelsu.ko"
        cp kernelsu.ko "$OUT_DIR/$OUTPUT_NAME"
        
        echo "Copied to: $OUT_DIR/$OUTPUT_NAME"
        ls -la "$OUT_DIR/$OUTPUT_NAME"
        echo "Size: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "$OUT_DIR/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "$OUT_DIR/$OUTPUT_NAME" | cut -f1)"
        
    - name: Upload x64 kernelsu.ko artifact
      if: ${{ inputs.arch == 'x86_64' }}
      uses: actions/upload-artifact@v7
      with:
        name: x86_64-${{ inputs.kmi }}-lkm
        path: /github/workspace/out/x86_64/${{ inputs.kmi }}_kernelsu.ko
