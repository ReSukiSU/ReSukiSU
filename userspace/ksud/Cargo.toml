[package]
name = "ksud"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
const_format = "0.2"
log = "0.4"
rust-embed = { version = "8", features = [
    "debug-embed",
    "compression", # must clean build after updating binaries
] }
which = "8"
sha1 = "0.11"
sha256 = "1"
tempfile = "3"
chrono = "0.4"
regex-lite = "0.1"
android-bootimg = { git = "https://github.com/5ec1cff/android_bootimg", rev = "150425b027c76ea104c82e408571651f2181b2c2" }
memmap2 = "0.9.10"
bitflags = "2.11.0"
base16ct = { version = "1.0.0", features = ["alloc"] }
figlet-rs = "1.0.0"
memchr = "2.8.3"

[target.'cfg(target_os = "android")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = [
    "process",
    "thread",
    "fs",
    "system",
    "stdio",
] }
android_logger = { version = "0.15", default-features = false }
zip = { version = "8", features = [
    "deflate",
    "deflate64",
    "time",
    "lzma",
    "xz",
], default-features = false }
java-properties = { git = "https://github.com/Kernel-SU/java-properties.git", branch = "master", default-features = false }
serde_json = "1"
encoding_rs = "0.8"
humansize = "2"
libc = "0.2"
extattr = "1"
jwalk = "0.9"
is_executable = "1"
nom = "8"
derive-new = "0.7"
getopts = "0.2"
serde = { version = "1.0", features = ["derive"] }
ksuinit = { path = "../ksuinit" }
adb_client = { git = "https://github.com/Kernel-SU/adb_client" }
num_enum = "0.7"
inotify = "0.11.2"
prop-rs-android = { git = "https://github.com/Kernel-SU/ksu_props", rev = "6f5723105d8d4cacad31d83d343defbf032c7b33" }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = { version = "0.11.10", default-features = false }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[build-dependencies]
bindgen = "0.72.1"
cc = "1"
